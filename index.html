<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVIA — Clinical Intelligence for Physiotherapy</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="app.js"></script><script src="assessment-v2.js"></script><script>(function(){function mount(){var p=document.querySelector('.page');if(!p||!p.querySelector('.tabs')||p.querySelector('#movia-comprehensive-inline'))return;var box=document.createElement('div');box.id='movia-comprehensive-inline';box.className='assessment-enhanced';var s=[['1. Pain & Symptom Profile',['Pain location / distribution','Onset & duration','Aggravating factors','Easing factors','24-hour pattern / irritability']],['2. Safety & Screening',['Red-flag screening','Neurological screen','Precautions / contraindications']],['3. Functional Assessment',['Activity limitations','Participation restrictions','Patient goals','Outcome measure & baseline']],['4. Objective Examination',['Regional ROM / movement quality','MMT / strength pattern','Special tests','Palpation / symptom reproduction','Gait / functional movement']],['5. Clinical Impression',['Key impairments','Clinical priorities','Working clinical impression','Assessment plan / reassessment criteria']]];var h='<div class="assessment-intro"><div><b>COMPREHENSIVE CLINICAL ASSESSMENT</b><span>Structured physiotherapy documentation for clinician review</span></div><span class="assessment-badge">MOVIA V1</span></div>';s.forEach(function(x){h+='<section class="assessment-section"><div class="section-title">'+x[0]+'</div><div class="assessment-grid">';x[1].forEach(function(label,i){h+='<div class="field"><label>'+label+'</label><textarea rows="2" placeholder="Document clinical findings..."></textarea></div>'});h+='</div></section>'});h+='<div class="assessment-footer"><div class="mini">Structured decision support only. Final clinical judgement remains with the treating physiotherapist.</div><button type="button" class="primary" id="save-comprehensive">Save Comprehensive Assessment</button></div>';box.innerHTML=h;var a=p.querySelector('.actions');if(a)a.before(box);else p.appendChild(box);document.getElementById('save-comprehensive').onclick=function(){this.textContent='Assessment Saved ✓';setTimeout(function(){document.getElementById('save-comprehensive').textContent='Save Comprehensive Assessment'},1800)}};setInterval(mount,500);mount()})();</script></body></html>
