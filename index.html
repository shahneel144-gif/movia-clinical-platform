<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVIA — Clinical Intelligence for Physiotherapy</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="app.js"></script><script>function moviaMountAssessment(){var app=document.getElementById('app');if(!app)return;var pages=app.querySelectorAll('.page');for(var i=0;i<pages.length;i++){var p=pages[i];if(!p.querySelector('.tabs')||p.querySelector('.movia-direct-assessment'))continue;var box=document.createElement('section');box.className='movia-direct-assessment';box.style.cssText='margin-top:20px;border:1px solid #dce7ea;border-radius:16px;background:#fff;padding:22px';var sections=[['1. Pain & Symptom Profile',['Pain location / distribution','Onset & duration','Aggravating factors','Easing factors','24-hour pattern / irritability']],['2. Safety & Screening',['Red-flag screening','Neurological screen','Precautions / contraindications']],['3. Functional Assessment',['Activity limitations','Participation restrictions','Patient goals','Outcome measure & baseline']],['4. Objective Examination',['Regional ROM / movement quality','MMT / strength pattern','Special tests','Palpation / symptom reproduction','Gait / functional movement']],['5. Clinical Impression',['Key impairments','Clinical priorities','Working clinical impression','Assessment plan / reassessment criteria']]];var h='<div style="display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px"><div><div style="font-size:18px;font-weight:700">COMPREHENSIVE CLINICAL ASSESSMENT</div><div style="font-size:12px;color:#718087;margin-top:4px">Structured physiotherapy documentation for clinician review</div></div><span style="font-size:11px;font-weight:700;padding:7px 10px;border-radius:999px;background:#e8f7f8;color:#167b83">MOVIA V1</span></div>';for(var j=0;j<sections.length;j++){h+='<div style="border-top:1px solid #e5edef;padding:18px 0"><h4 style="margin:0 0 12px">'+sections[j][0]+'</h4><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">';for(var k=0;k<sections[j][1].length;k++){h+='<div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">'+sections[j][1][k]+'</label><textarea rows="2" placeholder="Document clinical findings..." style="width:100%;box-sizing:border-box;border:1px solid #d8e3e6;border-radius:9px;padding:10px;font:inherit"></textarea></div>'}h+='</div></div>'}h+='<div style="border-top:1px solid #e5edef;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:15px"><span style="font-size:11px;color:#718087">Structured decision support only. Final clinical judgement remains with the treating physiotherapist.</span><button type="button" class="primary" id="movia-direct-save">Save Comprehensive Assessment</button></div>';box.innerHTML=h;var actions=p.querySelector('.actions');if(actions)actions.parentNode.insertBefore(box,actions);else p.appendChild(box);box.querySelector('#movia-direct-save').onclick=function(){var b=this;b.textContent='Assessment Saved ✓';setTimeout(function(){b.textContent='Save Comprehensive Assessment'},1800)}}}moviaMountAssessment();new MutationObserver(function(){moviaMountAssessment()}).observe(document.body,{childList:true,subtree:true});setInterval(moviaMountAssessment,250);</script></body></html>
